name: PhoneRunner
options:
  bundleIdPrefix: io.github.ccch1mneyyy.dshgo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    SDKROOT: iphoneos
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  PhoneRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: PhoneRunnerUITests
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ccch1mneyyy.dshgo.PhoneRunner
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        USES_XCTRUNNER: YES
        TEST_TARGET_NAME: ""
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PhoneRunner-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Sources/PhoneRunnerSelf.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"

schemes:
  PhoneRunnerUITests:
    build:
      targets:
        PhoneRunnerUITests: all
    test:
      targets:
        - PhoneRunnerUITests
